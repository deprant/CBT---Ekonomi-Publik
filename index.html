<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Ekonomi Publik</title>

```
<link rel="stylesheet" href="style.css">
```

</head>
<body>

<div class="container">

```
<div id="login-page">
    <h1>CBT Ekonomi Publik</h1>

    <div class="card">
        <input type="text" id="nama" placeholder="Nama Mahasiswa" required>
        <input type="text" id="nim" placeholder="NIM" required>
        <input type="text" id="kelas" placeholder="Kelas" required>

        <button onclick="startExam()">Mulai Ujian</button>
    </div>
</div>

<div id="exam-page" style="display:none;">

    <div class="top-bar">
        <div id="timer">20:00</div>
        <div id="progress">Soal 1 / 10</div>
    </div>

    <div class="card">
        <h2 id="question"></h2>

        <div id="options"></div>

        <div class="navigation">
            <button onclick="prevQuestion()">Previous</button>
            <button onclick="nextQuestion()">Next</button>
        </div>
    </div>

    <div class="submit-area">
        <button class="submit-btn" onclick="submitExam()">
            Submit Ujian
        </button>
    </div>

</div>

<div id="result-page" style="display:none;">
    <div class="card">
        <h1>Ujian Selesai</h1>

        <h2 id="score-display"></h2>

        <p>Jawaban Anda telah dikirim.</p>
    </div>
</div>

<footer class="footer-credit">
    CBT Ekonomi Publik<br>
    Developed by Ade Paranata
</footer>
```

</div>

<script src="questions.js"></script>

<script src="app.js"></script>

</body>
</html>
